name: Release DXVK modded for WoW

# Every push to st0ny-main checks whether upstream has been merged since the
# latest upstream DXVK release and whether that release is still missing here.
# If so, the upstream release tag plus the modifications from st0ny-main is
# tagged, built and released.

on:
  push:
    branches: [st0ny-main]
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag, e.g. v3.1.1 (empty for the latest upstream release)
        type: string
        default: ''
      notes_only:
        description: Only update title, notes and zip name, keep the published d3d9.dll
        type: boolean
        default: false
      recreate:
        description: Delete and recreate an existing release and its tag, keeping the modified source
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: doitsujin/dxvk
  # No spaces: GitHub replaces them with dots in asset names
  ZIP_FILE: DXVK-WoW-PR.zip

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      latest: ${{ steps.check.outputs.latest }}
      action: ${{ steps.check.outputs.action }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check for a release to create
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_TAG: ${{ inputs.tag }}
        NOTES_ONLY: ${{ inputs.notes_only }}
        EVENT: ${{ github.event_name }}
      run: |
        set -o pipefail

        latest=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
        tag="${INPUT_TAG:-$latest}"

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        # Releasing an older version later must not mark it as the latest
        if [ "$tag" = "$latest" ]; then
          echo "latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "latest=false" >> "$GITHUB_OUTPUT"
        fi
        echo "Upstream release: $tag"

        if [ "$NOTES_ONLY" = "true" ]; then
          echo "action=notes" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # A push only creates releases that do not exist yet, a manual run
        # rebuilds an existing one
        if [ "$EVENT" = "push" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release $tag exists already, nothing to do."
          echo "action=skip" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Upstream tags its releases on release branches, not on master. Only
        # release once master has been merged after the release, so that
        # merge conflicts have been resolved on st0ny-main.
        git fetch --no-tags "https://github.com/$UPSTREAM" \
          "refs/heads/master:refs/upstream/master" \
          "refs/tags/$tag:refs/upstream-tags/$tag"

        base=$(git merge-base HEAD refs/upstream/master)

        if [ "$(git log -1 --format=%ct "$base")" -lt "$(git log -1 --format=%ct "refs/upstream-tags/$tag^{commit}")" ]; then
          if [ "$EVENT" = "push" ]; then
            echo "::notice::Upstream has not been merged into st0ny-main since $tag, no release created."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Upstream has not been merged into st0ny-main since $tag."
          exit 1
        fi

        echo "action=release" >> "$GITHUB_OUTPUT"

  tag:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.action == 'release' }}

    steps:
    - name: Check token
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        if [ -z "$RELEASE_TOKEN" ]; then
          echo "::error::Secret RELEASE_TOKEN is missing, it is needed to push release tags."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Tag upstream release with the modifications
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
        RECREATE: ${{ inputs.recreate }}
      run: |
        set -o pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch --no-tags "https://github.com/$UPSTREAM" \
          "refs/heads/master:refs/upstream/master" \
          "+refs/tags/*:refs/upstream-tags/*"

        upstream_commit=$(git rev-parse "refs/upstream-tags/$TAG^{commit}")
        force=
        existing=
        ported=false

        if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$upstream_commit" ]; then
            if [ "$RECREATE" != "true" ]; then
              echo "Tag $TAG already carries the modifications, keeping it."
              exit 0
            fi
            existing=$(git rev-parse "refs/tags/$TAG^{commit}")
          fi
          # A plain copy of the upstream tag gets replaced
          force=--force
        fi

        if [ -n "$existing" ]; then
          echo "Tagging the modifications of the existing tag $TAG again."
          git checkout --detach "$existing"
        # A branch port/<tag> holds the modifications ported to an upstream
        # release by hand, for releases they do not apply to automatically
        elif git fetch --no-tags origin "refs/heads/port/$TAG:refs/port" 2> /dev/null; then
          if ! git merge-base --is-ancestor "$upstream_commit" refs/port; then
            echo "::error::Branch port/$TAG is not based on upstream $TAG."
            exit 1
          fi

          echo "Using the modifications ported by hand on port/$TAG."
          git checkout --detach refs/port
          ported=true
        else
          # All modifications are the difference between st0ny-main and the
          # upstream commit it was last merged with, including conflict
          # resolutions. The CI configuration stays as it is upstream.
          main=$(git rev-parse HEAD)
          base=$(git merge-base "$main" refs/upstream/master)
          git diff --binary "$base" "$main" -- . ':(exclude).github' > "$RUNNER_TEMP/mods.patch"

          git checkout --detach "$upstream_commit"

          if ! git apply --3way --index --whitespace=nowarn "$RUNNER_TEMP/mods.patch"; then
            echo "::error::The modifications do not apply to upstream $TAG, see the conflicts above. Port them by hand on a branch port/$TAG."
            git status --short
            exit 1
          fi

          {
            echo "WoW modifications for DXVK $TAG"
            echo
            # Commits from upstream release branches are not modifications
            git log --no-merges --reverse --format='- %s' "$base..$main" \
              --not --glob='refs/upstream-tags/*' -- . ':(exclude).github'
          } > "$RUNNER_TEMP/message.txt"

          git commit -q -F "$RUNNER_TEMP/message.txt"
        fi

        # GitHub lists releases by the date of their tags, so the tag gets
        # the date of the upstream release
        tag_date=$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/upstream-tags/$TAG")
        if [ -z "$tag_date" ]; then
          tag_date=$(git log -1 --format=%cI "$upstream_commit")
        fi

        GIT_COMMITTER_DATE="$tag_date" git tag -f -a "$TAG" -m "DXVK $TAG modded for WoW with Project Reforged"
        git push $force origin "refs/tags/$TAG"

        # The tag keeps the ported commit, the branch is not needed anymore
        if [ "$ported" = "true" ]; then
          git push origin --delete "port/$TAG"
        fi

  build-d3d9-x32:
    runs-on: ubuntu-latest
    needs: [prepare, tag]
    if: ${{ needs.prepare.outputs.action == 'release' }}
    container: archlinux/archlinux:base-devel

    steps:
    - name: Setup container
      run: |
        pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ needs.prepare.outputs.tag }}
        submodules: recursive
        fetch-depth: 0

    - name: Build release
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        ./package-release.sh "$TAG" build --no-package --32-only
        cp "build/dxvk-$TAG/x32/d3d9.dll" d3d9.dll

    - name: Upload d3d9.dll
      uses: actions/upload-artifact@v7
      with:
        name: d3d9-x32
        path: d3d9.dll
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build-d3d9-x32]
    # Also run when the build was skipped for a notes-only update
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.action == 'release' || needs.prepare.outputs.action == 'notes') }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      NOTES_ONLY: ${{ needs.prepare.outputs.action == 'notes' }}

    steps:
    - name: Checkout README
      uses: actions/checkout@v6
      with:
        sparse-checkout: README.md
        sparse-checkout-cone-mode: false

    - name: Download d3d9.dll
      if: ${{ needs.prepare.outputs.action == 'release' }}
      uses: actions/download-artifact@v7
      with:
        name: d3d9-x32
        path: build

    - name: Write release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail

        # The list of modifications from the README, between its intro line
        # and the paragraph about releases
        awk '/^A fork of \[DXVK\]/ { found = 1; next }
             /^Releases of this fork/ { found = 0 }
             found' README.md > mods.md

        if ! grep -q '[^[:space:]]' mods.md; then
          echo "::error::List of modifications not found in README.md"
          exit 1
        fi

        {
          echo "A version of DXVK tailored to World of Warcraft 1.12 and 3.3.5a as well as Project Reforged."
          echo
          echo "This release contains the 32-bit d3d9.dll, built from upstream DXVK $TAG with the following modifications:"
          cat mods.md
          echo "## Installation"
          echo
          echo "1. Download \`$ZIP_FILE\` and extract \`d3d9.dll\` into your WoW directory, next to the game executable."
          echo '2. Optional: create `WTF/dxvk.conf` to change settings, e.g. `d3d9.enlargeHardwareCursor = 1` for the original cursor size.'
          echo '3. To uninstall, delete `d3d9.dll` from the WoW directory.'
          echo
          echo "A GPU and driver with Vulkan support are required."
          echo
          echo "---"
          echo
          echo "## Original release notes of DXVK $TAG"
          echo
          # Point bare issue and PR references like "#1234" to the upstream
          # repository, they would otherwise link to this fork
          gh release view "$TAG" --repo "$UPSTREAM" --json body -q .body |
            perl -pe 's{(?<![\w/&])(?<!\]\()#(\d+)\b}{doitsujin/dxvk#$1}g'
        } > notes.md

        cat notes.md

    - name: Create release
      env:
        # GITHUB_TOKEN may not create releases on tags that differ from the
        # default branch in their workflow files
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        GH_REPO: ${{ github.repository }}
        LATEST: ${{ needs.prepare.outputs.latest }}
        RECREATE: ${{ inputs.recreate && needs.prepare.outputs.action == 'release' }}
      run: |
        title="DXVK $TAG (modded for WoW with Project Reforged)"

        # A release keeps the date of the tag it was created with
        if [ "$RECREATE" = "true" ] && gh release view "$TAG" > /dev/null 2>&1; then
          gh release delete "$TAG" --yes
        fi

        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release edit "$TAG" --title "$title" --notes-file notes.md
        elif [ "$NOTES_ONLY" = "true" ]; then
          echo "::error::Release $TAG does not exist, run without notes_only"
          exit 1
        fi

        # Zip archives on the release other than the current one
        old_zips() {
          gh api "repos/$GH_REPO/releases/tags/$TAG" \
            --jq '.assets[] | select((.name | endswith(".zip")) and .name != env.ZIP_FILE) | .id'
        }

        if [ "$NOTES_ONLY" = "true" ]; then
          for id in $(old_zips); do
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$id" -f name="$ZIP_FILE" > /dev/null
          done
          exit 0
        fi

        mkdir pkg
        cp build/d3d9.dll pkg/
        (cd pkg && zip "../$ZIP_FILE" d3d9.dll)

        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" "$ZIP_FILE" --clobber

          for id in $(old_zips); do
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
          done
        else
          gh release create "$TAG" "$ZIP_FILE" \
            --verify-tag \
            --latest="$LATEST" \
            --title "$title" \
            --notes-file notes.md
        fi
